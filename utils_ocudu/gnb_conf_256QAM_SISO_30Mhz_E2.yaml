# This example configuration outlines how to configure the srsRAN Project gNB to create a single TDD cell
# transmitting in band 78, with 20 MHz bandwidth and 30 kHz sub-carrier-spacing. A USRP B200 is configured
# as the RF frontend using split 8. Note in this example an external clock source is not used, so the sync
# is not defined and the default is used.
ran_node_name: gNB-srsRAN-256QAM_SISO_E2_30Mhz
gnb_id: 421 
cu_cp:
  amf:
    addr: 172.31.0.26  # AMF ngap IP
    port: 38412
    bind_addr: 172.31.0.54  # local IP
    supported_tracking_areas:
      - tac: 2 
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
                sd: 000002
              #- sst: 1
                #sd: 000002

ru_sdr:
  device_driver: uhd
  device_args: type=b200,num_recv_frames=64,num_send_frames=64
    #device_args: type=b200
  clock: internal #gpsdo #internal                                             # Specify the clock source used by the RF. NOTE: Set to internal if NOT using an external 10 MHz reference clock.  
  sync: internal #gpsdo
  srate: 30.72 #23.04
  otw_format: sc12
  tx_gain: 80
  rx_gain: 40

cell_cfg:
  pdsch:
    mcs_table: qam256
  ssb:
    ssb_period: 20
  dl_arfcn: 650000 #648666
  band: 78
  channel_bandwidth_MHz: 30
  common_scs: 30
  plmn: "00101"
  tac: 2
  pci: 1

e2:
  e2sm_kpm_enabled: true            # Enable KPM service module
  e2sm_rc_enabled: true             # Enable RC service module
  enable_du_e2: true                # Enable DU E2 agent (one for each DU instance)
  e2sm_kpm_enabled: true            # Enable KPM service module
  e2sm_rc_enabled: true             # Enable RC service module
  bind_addr: 172.31.0.54                #10.0.2.1
  addr: 172.31.0.57                   # RIC IP address
  port: 36421                       # RIC port


log:
  filename: /tmp/gnb.log
  all_level: info 

pcap:
  e2ap_enable: true
  mac_enable: false
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: false
  ngap_filename: /tmp/gnb_ngap.pcap

    #metrics:
    #  autostart_stdout_metrics: true
    #  enable_json: true       # Enable reporting metrics in JSON format
    #  addr: 172.19.1.4                # Metrics-server IP
    #  port: 55555                     # Metrics-server Port
