services:
  gnb:
    container_name: ocudu_gnb
    # Build info
    image: ocudu/gnb
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OS: ${OS:-ubuntu}
        OS_VERSION: ${OS_VERSION:-26.04}
    # privileged mode is requred only for accessing usb devices
    privileged: true
    # Extra capabilities always required
    cap_add:
      - SYS_NICE
      - CAP_SYS_PTRACE
    volumes:
      # Access USB to use some SDRs
      - /dev/bus/usb/:/dev/bus/usb/
      # Sharing images between the host and the pod.
      # It's also possible to download the images inside the pod
      - /usr/share/uhd/images:/usr/share/uhd/images
      # Save logs and more into gnb-storage
      - gnb-storage:/tmp
    # It creates a file/folder into /config_name inside the container
    # Its content would be the value of the file used to create the config
    configs:
      - gnb_config.yml
      - gnb_compose_config.yml
    # Customize your desired network mode.
    # current netowrk configuration creastes a private netwoek with both containers attached
    # An alterantive would be `network: host"`. That would expose your host network into the container. It's the easiest to use if the 5gc is not in your PC
    networks:
      macvlan-dhcp:
        ipv4_address: 172.31.0.157
          #  metrics:
          #    ipv4_address: 172.31.0.157
    # Command to run into the final container
    command: gnb -c /gnb_config.yml -c /gnb_compose_config.yml

  telegraf:
    container_name: telegraf
    image: ocudu/telegraf
    build:
      context: telegraf
    depends_on:
      influxdb:
        condition: service_healthy
    env_file:
      - .env
    # Enable host.docker.internal on Linux (works by default on Docker Desktop for Mac/Windows)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # volumes:
    #   - /tmp/metrics.txt:/etc/ocudu/metrics.txt:ro # Uncomment to use an input metrics file
    networks:
      metrics:
        ipv4_address: 172.19.1.4

  influxdb:
    container_name: influxdb
    image: influxdb:${INFLUXDB3_VERSION}
    user: "0:0"
    volumes:
      - influxdb-storage:/var/lib/influxdb3:rw
    env_file:
      - .env
    environment:
      - LOG_FILTER=${INFLUXDB3_LOG_LEVEL}
    command: >
      --object-store=memory --data-dir=/var/lib/influxdb3 --plugin-dir=/var/lib/influxdb3-plugins --node-id="${INFLUXDB_NODE_ID:-node0}" --http-bind="${INFLUXDB3_HTTP_BIND_ADDR}" --without-auth
    restart: on-failure:10
    healthcheck:
      test: >
        curl -f ${INFLUXDB3_HOST_URL}/health
      timeout: 5s
      interval: 1s
    networks:
      metrics:
        ipv4_address: 172.19.1.5

  grafana:
    container_name: grafana
    image: ocudu/grafana
    build:
      context: grafana
      args:
        GF_VERSION: ${GF_VERSION}
        LOGO_URL: ${GF_LOGO_URL}
    volumes:
      - grafana-storage:/var/lib/grafana:rw
    env_file:
      - .env
    depends_on:
      telegraf:
        condition: service_started
    ports:
      - 3300:${GF_PORT}
    networks:
      metrics:
        ipv4_address: 172.19.1.6

configs:
  gnb_config.yml:
    file: ${GNB_CONFIG_PATH:-../../utils_ocudu/gnb_conf_256QAM_MIMO_30Mhz.yaml}
  gnb_compose_config.yml:
    content: |
      metrics:
        autostart_stdout_metrics: true
        enable_json: true
      remote_control:
        bind_addr: 0.0.0.0
        enabled: true

volumes:
  gnb-storage:
  influxdb-storage:
  grafana-storage:

networks:
  macvlan-dhcp:
    external: true
  metrics:
    ipam:
      driver: default
      config:
        - subnet: 172.19.1.0/24
