      discovery_rules:
        - uuid: c0864250630540318a56ec16a3b1c0ff
          name: 'Network interface discovery'
          key: net.if.discovery
          delay: 30s
          filter:
            conditions:
              - macro: '{#IFNAME}'
                value: ^(wlan|rmnet0|rmnet1)
          lifetime_type: DELETE_IMMEDIATELY
          item_prototypes:
            - uuid: bb32264041b7454891b43e8e8c90b15f
              name: 'Incoming network traffic on {#IFNAME}'
              key: 'net.if.in[{#IFNAME}]'
              history: 90d
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: Network
            - uuid: 5ed9ec433c7d40caa287f04c14101162
              name: 'Outgoing network traffic on {#IFNAME}'
              key: 'net.if.out[{#IFNAME}]'
              history: 90d
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: Network
        - uuid: 0f3edef020444a1a9e780b74134bf992
          name: 'Mounted filesystem discovery'
          key: vfs.fs.discovery
          delay: 30s
          filter:
            conditions:
              - macro: '{#FSNAME}'
                value: ^/(mnt/expand|data)
          lifetime_type: DELETE_IMMEDIATELY
          item_prototypes:
            - uuid: 3dd03dc1128745df880ffb5b5bc393a5
              name: 'Free disk space on {#FSNAME}'
              key: 'vfs.fs.size[{#FSNAME},free]'
              history: 90d
              units: B
              tags:
                - tag: Application
                  value: Storage
            - uuid: 64f640051e1a4f5b9736d0b8ab047432
              name: 'Free disk space on {#FSNAME} (percentage)'
              key: 'vfs.fs.size[{#FSNAME},pfree]'
              history: 90d
              units: '%'
              tags:
                - tag: Application
                  value: Storage
            - uuid: 55b1b08a2d1c41059a1f60cbdf02e384
              name: 'Total disk space on {#FSNAME}'
              key: 'vfs.fs.size[{#FSNAME},total]'
              delay: 1h
              history: 90d
              units: B
              tags:
                - tag: Application
                  value: Storage
  graphs:
