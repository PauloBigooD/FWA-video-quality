zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: 9b3355b828d04b20818881b2861475ca
      template: 'UE Android LANCE'
      name: 'UE Android LANCE'
      templates:
        - name: 'Template App Zabbix Agent'
      groups:
        - name: Templates
      items:
        - uuid: e097c87299644a6c911db54ad50b9297
          name: Manufacturer
          type: ZABBIX_ACTIVE
          key: android.manufacturer
          value_type: TEXT
        - uuid: 8c825b5a73954f5a8aae6058a078f6fd
          name: Model
          type: ZABBIX_ACTIVE
          key: android.model
          delay: 24h
          value_type: TEXT
          tags:
            - tag: Application
              value: General
        - uuid: a61f3198f04e49c185659c6419377c57
          name: 'CPU Usage estimated (total)'
          type: CALCULATED
          key: cpu.usage.estimated
          delay: 10s
          value_type: FLOAT
          trends: '0'
          units: '%'
          params: |
            (
            last(//system.cpu.freq[0,current]) +
            last(//system.cpu.freq[1,current]) +
            last(//system.cpu.freq[2,current]) +
            last(//system.cpu.freq[3,current]) +
            last(//system.cpu.freq[4,current]) +
            last(//system.cpu.freq[5,current]) +
            last(//system.cpu.freq[6,current]) +
            last(//system.cpu.freq[7,current])
            ) 
            /
            16400000000
            * 100
          tags:
            - tag: Application
              value: CPU
        - uuid: 0b48be6772d34b3cb485a2b14942e0e8
          name: 'Display state'
          key: 'display.state[0]'
